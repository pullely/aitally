apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: AT-3
spec:
  goal: A company can publish training material (stored in R2 with its SHA-256), assign it to staff, let only the assignee record completion (score, time, the material hash taken), remind them on a daily ladder that escalates, and re-assign it every year.
  # Component refs, fully qualified (runbook trap 15). No new policy action is
  # added (training reuses tally.read / tally.write), so policy-worker is not
  # redeployed. packages/db and packages/contracts gain new tally modules only,
  # which no other worker reads, so only the workers that use them are touched
  # (trap 17): tally-worker, api-edge (facade), notifications-worker
  # (templates), events-worker (subject prefixes), and the console.
  affects:
    - default/aitally/db
    - default/aitally/db-tests
    - default/aitally/db-migrate
    - default/aitally/contracts
    - default/aitally/contracts-tests
    - default/aitally/sdk
    - default/aitally/tally-worker
    - default/aitally/tally-worker-tests
    - default/aitally/api-edge
    - default/aitally/api-edge-tests
    - default/aitally/events-worker
    - default/aitally/notifications-worker
    - default/aitally/notifications-worker-tests
    - default/aitally/web-console-next
    - default/aitally/web-console-next-tests
    - default/aitally/cloudflare-r2
  doneWhen:
    - migration 210_tally_training is in the manifest, replays green against node:sqlite, and is applied on stage and prod
    - on stage course material uploads to the prefixed R2 bucket and downloads with the same SHA-256
    - only the assignee can complete an assignment (anyone else gets 404); completion records completedAt, scorePct and materialSha256
    - each reminder rung is claimed and sent once across two sweeps on the same day; late rungs add the tool owner, late14 the org owners
    - a completion recurrence_months old produces the next cycle's assignment exactly once
    - GET /v1/me/training returns the caller's own assignments and is routed to tally-worker ahead of the /v1/me identity routes
    - the 0 7 * * * cron is live on tally-worker in stage and prod
  gates: []
